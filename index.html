<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Valet 2026 – Prediktion!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .description {
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .mode {
      padding: 10px 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      background: #f0f0f0;
      font-size: 14px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background: #eeeeee;
    }

    td:first-child {
      font-weight: bold;
      width: 30%;
    }

    .percent-cell {
      transition: background-color 0.2s;
    }

    .percent-cell.under {
      background-color: rgba(128, 128, 128, 0.15);
    }

    .percent-cell.correct {
      background-color: rgba(40, 167, 69, 0.18);
    }

    .percent-cell.over {
      background-color: rgba(220, 53, 69, 0.18);
    }

    .value-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      font-size: 16px;
      text-align: center;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: white;
    }

    .fine-button {
      display: none;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      padding: 0;
      margin: 0;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #f3f3f3;
      color: #222;
      font-size: 22px;
      font-weight: normal;
      line-height: 1;
      cursor: pointer;
    }

    .fine-button:hover {
      background: #e5e5e5;
    }

    body.fine-mode .fine-button {
      display: block;
    }

    /*
      I finslipningsläget tar vi bort webbläsarens egna
      små pilar eftersom vi har tydligare +/- knappar.
    */
    body.fine-mode input[type="number"]::-webkit-inner-spin-button,
    body.fine-mode input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    body.fine-mode input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .sum-row td {
      font-weight: bold;
      border-top: 2px solid #888;
    }

    #sum {
      font-size: 18px;
    }

    .message {
      min-height: 22px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .message.error {
      color: #b42318;
    }

    .message.ok {
      color: #137333;
    }

    .main-button {
      width: 100%;
      padding: 11px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }

    .main-button:disabled {
      background: #aaa !important;
      cursor: not-allowed;
    }

    #fineModeButton {
      background: #e4e4e4;
      color: #222;
    }

    #generateButton {
      background: #222;
      color: white;
    }

    #copyButton {
      background: #e5e5e5;
      color: #222;
    }

    #resultContainer {
      display: none;
      margin-top: 24px;
    }

    textarea {
      width: 100%;
      height: 230px;
      resize: vertical;
      padding: 12px;
      font-family: monospace;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Valet 2026 – Prediktion</h1>

  <p class="description">
    Börja med att göra en preliminär gissning i steg om 0,5 procentenheter.
    När summan är exakt 100 % kan du gå vidare och finslipa resultatet
    i steg om 0,1 procentenheter.
  </p>

  <div id="modeText" class="mode">
    Grundläge: steg om 0,5 %
  </div>

  <table>
    <thead>
      <tr>
        <th>Parti</th>
        <th>Prediktion (%)</th>
      </tr>
    </thead>

    <tbody>

      <tr>
        <td>S</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="S" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>SD</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="SD" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>M</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="M" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>V</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="V" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>C</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="C" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>MP</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="MP" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>KD</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="KD" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>L</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="L" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr>
        <td>ÖVR</td>
        <td class="percent-cell">
          <div class="value-control">
            <button class="fine-button minus" type="button">−</button>
            <input type="number" data-party="ÖVR" min="0" max="100" step="0.5" value="0">
            <button class="fine-button plus" type="button">+</button>
          </div>
        </td>
      </tr>

      <tr class="sum-row">
        <td>Summa</td>
        <td class="percent-cell">
          <span id="sum">0 %</span>
        </td>
      </tr>

    </tbody>
  </table>

  <div id="message" class="message"></div>

  <button
    id="fineModeButton"
    class="main-button"
    type="button"
    disabled
  >
    Finslipa gissningen
  </button>

  <button
    id="generateButton"
    class="main-button"
    type="button"
    disabled
  >
    Skapa prediktion
  </button>

  <div id="resultContainer">

    <h2>Resultat</h2>

    <textarea id="result" readonly></textarea>

    <button
      id="copyButton"
      class="main-button"
      type="button"
    >
      Kopiera text
    </button>

  </div>

</div>


<script>

  const inputs = document.querySelectorAll('input[type="number"]');
  const percentCells = document.querySelectorAll('.percent-cell');

  const sumElement = document.getElementById('sum');
  const messageElement = document.getElementById('message');
  const modeText = document.getElementById('modeText');

  const fineModeButton = document.getElementById('fineModeButton');
  const generateButton = document.getElementById('generateButton');
  const copyButton = document.getElementById('copyButton');

  const resultContainer = document.getElementById('resultContainer');
  const result = document.getElementById('result');

  let fineMode = false;


  function getPrecision() {
    return fineMode ? 0.1 : 0.5;
  }


  function isValidStep(value) {

    const precision = getPrecision();
    const multiplier = 1 / precision;

    return Math.abs(
      value * multiplier - Math.round(value * multiplier)
    ) < 0.000001;

  }


  function formatNumber(number) {

    number = Math.round(number * 10) / 10;

    if (Number.isInteger(number)) {
      return number.toString();
    }

    return number.toFixed(1);

  }


  function getSum() {

    let sum = 0;

    inputs.forEach(input => {

      const value = Number(input.value);

      if (Number.isFinite(value)) {
        sum += value;
      }

    });

    return Math.round(sum * 10) / 10;

  }


  function updatePrediction() {

    let allValid = true;
    let sum = 0;

    inputs.forEach(input => {

      const value = Number(input.value);

      if (
        input.value === "" ||
        !Number.isFinite(value) ||
        value < 0 ||
        value > 100 ||
        !isValidStep(value)
      ) {

        allValid = false;
        input.style.borderColor = "#dc3545";

      } else {

        input.style.borderColor = "#bbb";
        sum += value;

      }

    });


    sum = Math.round(sum * 10) / 10;

    sumElement.textContent = formatNumber(sum) + " %";


    percentCells.forEach(cell => {
      cell.classList.remove("under", "correct", "over");
    });


    if (!allValid) {

      percentCells.forEach(cell => {
        cell.classList.add("under");
      });

      messageElement.textContent = fineMode
        ? "Alla värden måste anges i steg om 0,1 %."
        : "Alla värden måste anges i steg om 0,5 %.";

      messageElement.className = "message error";

      generateButton.disabled = true;

      if (!fineMode) {
        fineModeButton.disabled = true;
      }

      return;

    }


    if (sum > 100) {

      percentCells.forEach(cell => {
        cell.classList.add("over");
      });

      messageElement.textContent =
        "Minska med " + formatNumber(sum - 100) + " procentenheter.";

      messageElement.className = "message error";

      generateButton.disabled = true;

      if (!fineMode) {
        fineModeButton.disabled = true;
      }

    }

    else if (sum === 100) {

      percentCells.forEach(cell => {
        cell.classList.add("correct");
      });

      messageElement.textContent = fineMode
        ? "Finslipningen summerar till exakt 100 %."
        : "Grundgissningen summerar till exakt 100 %.";

      messageElement.className = "message ok";

      generateButton.disabled = false;

      if (!fineMode) {
        fineModeButton.disabled = false;
      }

    }

    else {

      percentCells.forEach(cell => {
        cell.classList.add("under");
      });

      messageElement.textContent =
        "Återstår: " + formatNumber(100 - sum) + " %.";

      messageElement.className = "message";

      generateButton.disabled = true;

      if (!fineMode) {
        fineModeButton.disabled = true;
      }

    }

  }


  function activateFineMode() {

    if (getSum() !== 100) {
      return;
    }

    fineMode = true;

    document.body.classList.add("fine-mode");

    modeText.textContent =
      "Finslipningsläge: justera i steg om 0,1 %";

    inputs.forEach(input => {
      input.step = "0.1";
    });

    fineModeButton.style.display = "none";

    updatePrediction();

  }


  function adjustValue(input, change) {

    let value = Number(input.value);

    if (!Number.isFinite(value)) {
      value = 0;
    }

    value += change;

    /*
      Avrunda till en decimal för att undvika
      JavaScripts flyttalsproblem, t.ex. 7.2 + 0.1.
    */
    value = Math.round(value * 10) / 10;

    if (value < 0) {
      value = 0;
    }

    if (value > 100) {
      value = 100;
    }

    input.value = value.toFixed(1);

    updatePrediction();

  }


  function generatePrediction() {

    if (getSum() !== 100) {
      return;
    }

    const lines = ["Valet 2026 Prediktion:"];

    inputs.forEach(input => {

      const party = input.dataset.party;
      const value = Number(input.value);

      lines.push(
        party + ": " + formatNumber(value)
      );

    });

    result.value = lines.join("\n");

    resultContainer.style.display = "block";

  }


  async function copyPrediction() {

    try {

      await navigator.clipboard.writeText(result.value);

      copyButton.textContent = "Kopierat!";

      setTimeout(() => {
        copyButton.textContent = "Kopiera text";
      }, 1500);

    } catch {

      result.select();
      document.execCommand("copy");

    }

  }


  inputs.forEach(input => {

    input.addEventListener("input", updatePrediction);

    input.addEventListener("change", updatePrediction);

  });


  document.querySelectorAll(".minus").forEach(button => {

    button.addEventListener("click", () => {

      const input =
        button.closest(".value-control").querySelector("input");

      adjustValue(input, -0.1);

    });

  });


  document.querySelectorAll(".plus").forEach(button => {

    button.addEventListener("click", () => {

      const input =
        button.closest(".value-control").querySelector("input");

      adjustValue(input, 0.1);

    });

  });


  fineModeButton.addEventListener(
    "click",
    activateFineMode
  );


  generateButton.addEventListener(
    "click",
    generatePrediction
  );


  copyButton.addEventListener(
    "click",
    copyPrediction
  );


  updatePrediction();

</script>

</body>
</html>
